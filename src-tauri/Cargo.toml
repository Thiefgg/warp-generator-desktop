[package]
name = "warp-generator-desktop"
version = "0.2.4"
description = "Desktop application for generating Cloudflare WARP and AmneziaWG configurations"
authors = ["Sakeenkok <https://github.com/Thiefgg>"]
edition = "2021"

[lib]
name = "warp_generator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
getrandom = "0.2"
base64 = "0.22"
x25519-dalek = { version = "=2.0.0-rc.3", features = ["static_secrets"] }
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
aes = "0.8"
boringtun = "0.6"
wintun = "0.5"
ipnet = "2"
rand = "0.8"
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
